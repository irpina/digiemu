[boot]
# The OS's own check (MAIN OS 1.40A, "WRONG UI CARD") compares the card type
# with 0x0B.
ui_card = 0x0B

[memory]
ddr_mb = 128

[audio]
ssi_profile = "syntakt"
request_hz = 48000
rate = 48000
sample_bits = 24
ips = 64000000
fallback_request_hz = 2000

[intro]
channels = [3]
unblocks_frame_sem = false
post_intro_ips = 4680000
