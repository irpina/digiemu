# Digitone (mk1), and Digitone Keys: one OS file serves both.
#
# Same rule as digitakt.toml: no guest addresses for the emulator's own use.
# What lives here is what the image cannot tell us: which product this is,
# where each control sits on the panel MCU's scan matrix, what each code does
# and which LED lights which key.
#
# The Digitone has two ColdFire CPUs; the second one, which the firmware calls
# the DSP, renders the FM voices. emu/dsplink.py runs it: the second CPU's
# image (section 7 of the OS file) on its own engine, sharing the 128 KB dual-
# port RAM with the main OS, so the voices are rendered by the firmware's own
# code (see there).
#
# CONTROL CODES are the byte the firmware writes at +7 of its queue_send key
# record, as on the Digitakt. Both panel-test name tables the firmware builds
# at run time (the Digitone's 45 entries and the Keys' 55) label that screen,
# not the runtime keys, so every name below was MEASURED: each code pressed
# from a fresh resume of the settled snapshot, judged by what it drew, what it
# lit and, for PLAY, the transport word (2026-09-24).

[device]
name = "Digitone"
short = "dn1"
# SysEx framing ids, byte 4 (transport id) and byte 8 (OS-stream id) of the
# 16-byte framing message. Measured on OS 1.43.
sysex_id = 0x0d
os_stream_id = 0x08

[[firmware]]
version = "1.43"
sha256 = "c5a54cc05b921f2e4bd814834c5365c2a5aa01d7772a9a2961fac1c3095bf9aa"
filename = "Digitone_OS1.43.syx"

[card]
# No sample engine, so no ekFS sample volume on the +Drive: the card starts
# blank and the firmware's first boot lays down its projects and sounds.
ekfs = false

[panel]
# The window that draws this product: emu/dnpanel.py.
kind = "digitone"
# The scan matrix is not linear: every position is listed below.
linear_channels = 0
encoders = 9
# Wire counts per detent the window sends. The encoder driver (0x400dbd72 in
# 1.43, the Digitakt's twin) has a dead zone: an idle knob's state rests at
# 48 (0x400dbcb8 counts it back up), each count takes 3 off it, and nothing
# steps until it is at or below 24; for some parameters every step adds 48
# back. Measured: at 1 a knob needed ~16 notches before anything moved and
# felt dead; at 4, ATK moves one per detent once turning.
encoder_counts = 4
# The four pattern-page LEDs, page 1 first (page 1 is dim at idle and
# bright while playing, as on the Digitakt).
page_leds = [45, 44, 43, 42]

# code = [channel, bit], measured by pressing every (channel, bit) and reading
# the code the firmware reported. 1/2, 1/3 and 7/7 report 0, which is no key;
# channel 7 carries no keys.
[panel.exceptions]
1 = [0, 2]    # FUNC
2 = [0, 1]    # MIDI
3 = [0, 0]    # KEYBOARD
4 = [3, 0]    # PTN
5 = [5, 0]    # BANK
6 = [1, 0]    # SONG
7 = [1, 1]    # GLOBAL
8 = [2, 1]    # VOICE
9 = [3, 3]    # TEMPO
10 = [2, 0]   # RECORD
11 = [3, 2]   # PLAY
12 = [4, 1]   # STOP
13 = [3, 4]   # YES
14 = [4, 2]   # NO
15 = [3, 5]   # UP
16 = [4, 4]   # DOWN
17 = [4, 3]   # LEFT
18 = [3, 6]   # RIGHT
19 = [3, 7]   # PAGE
20 = [2, 2]   # TRIG
21 = [2, 3]   # SYN1
22 = [2, 4]   # SYN2
23 = [2, 5]   # FLTR
24 = [2, 6]   # AMP
25 = [2, 7]   # LFO
26 = [3, 1]   # trig 1
27 = [4, 0]   # trig 2
28 = [5, 3]   # trig 3
29 = [5, 4]   # trig 4
30 = [5, 5]   # trig 5
31 = [5, 6]   # trig 6
32 = [5, 7]   # trig 7
33 = [4, 5]   # trig 8
34 = [5, 1]   # trig 9
35 = [5, 2]   # trig 10
36 = [6, 0]   # trig 11
37 = [6, 1]   # trig 12
38 = [6, 2]   # trig 13
39 = [6, 3]   # trig 14
40 = [6, 4]   # trig 15
41 = [6, 5]   # trig 16
42 = [4, 6]   # T1
43 = [4, 7]   # T2
44 = [6, 6]   # T3
45 = [6, 7]   # T4
46 = [0, 4]   # encoder A push
47 = [0, 5]   # encoder B push
48 = [0, 6]   # encoder C push
49 = [0, 7]   # encoder D push
50 = [1, 4]   # encoder E push
51 = [1, 5]   # encoder F push
52 = [1, 6]   # encoder G push
53 = [1, 7]   # encoder H push
54 = [0, 3]   # LEVEL/DATA push

# How each code was identified (the settled SYN1 page, fresh resume each):
#   2   MIDI       the MIDI track page (MID 1: CHAN BANK SBNK PROG / PB AT MW BC)
#   3   KEYBOARD   its setup page (OCTAVE +/-, KB FOLD, SCALE, ROOT, CHORD)
#   4   PTN        "BANK A : SELECT PTN"          5  BANK  "SELECT BANK A..H"
#   6   SONG       "SONG MODE OFF" popup (the panel-test PATTERN MENU)
#   7   GLOBAL     SETTINGS (PROJECT / SONG / PATTERN / SOUNDS / MIDI CONFIG)
#   8   VOICE      voice stealing, unison, spread, layer
#   9   TEMPO      the BPM / SWING page
#   11  PLAY       the only code that moves the transport word 0 -> 1
#   15, 16         "Octave: +1" / "Octave: -1" (UP / DOWN on the main page)
#   17, 18         the tempo nudges, 81.7 / 90.3 while held (LEFT / RIGHT)
#   19  PAGE       lights the pattern-page LEDs
#   20..25         the TRIG, SYN1, SYN2, FLTR, AMP and LFO pages
#   26..41         trigs 1-16: in grid record each lights its own step LED
#   42..45         T1-T4: each shows its track's sound name and lights its LED
#   46..54         pushing an encoder shows the value under it
#   1   FUNC       held, the T1-T4 LEDs turn green (the mute view)
# 10, 12, 13, 14 (RECORD, STOP, YES, NO) follow the Digitakt's order: 10 lights
# LED 38 and turns the trig LEDs into the grid; the others draw nothing
# from the main page.

