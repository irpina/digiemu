# firmware's RAM shadows. YES/NO/arrows (28..33) are the keys the SONG popup
# lights (YES, UP, DOWN) with the Digitakt's order around them. The panel
# driver's own key/LED table agrees with every entry measured here, and adds
# 25 (PAGE) and 34 (FUNC), which no measured screen lit.
[panel.leds]
0 = 26
1 = 27
2 = 28
3 = 29
4 = 30
5 = 31
6 = 32
7 = 33
8 = 34
9 = 35
10 = 36
11 = 37
12 = 38
13 = 39
14 = 40
15 = 41
16 = 5    # BANK
17 = 4    # PTN
18 = 3    # KEYBOARD
19 = 20   # TRIG
20 = 21   # SYN1
21 = 22   # SYN2
22 = 23   # FLTR
23 = 24   # AMP
24 = 25   # LFO
