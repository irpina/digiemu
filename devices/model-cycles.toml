# Elektron Model:Cycles.
#
# The Model:Cycles and Model:Samples run the Digitakt mk1's processor (an
# MCF54418 with 128 MB of DDR), RTOS and framework, and boot under the same
# machinery. What their board adds -- a front panel the main CPU scans itself,
# an I2C audio codec, the PIT1 delay -- is emu/modelboard.py, installed when
# emu/symbols.py finds the Models' panel-scan handler. The two products share
# that board and this file's layout; only names and a few knobs differ (see
# model-samples.toml).

[device]
name = "Model:Cycles"
short = "mc"
sysex_id = 0x11
os_stream_id = 0x0c

[[firmware]]
version = "1.13"
sha256 = "44fe586269631a0ca7da25a3383fc6733c314809505fc3cc52f1e0ed9800640c"
filename = "model-cycles_OS1.13.syx"

# The ekFS sample volume must have mounted: the flag the format routine
# clears before it formats (the Digitakt's mounted_u32 counterpart).
[firmware.acceptance]
mounted_u32 = 0x40f07cf4

# The +Drive carries an ekFS volume at sector 0x1C0000, formatted by the
# Models' own routine with the Digitakt's constants, so the card is
# prepared as the Digitakt's is (emu/ekfsformat.py).
[card]
ekfs = true

# The window: emu/mdpanel.py. Codes are the firmware's own key codes (the
# table at 0x4010aef8 on Model:Cycles 1.13 maps scan bits to them).
[panel]
kind = "model"
linear_channels = 0
encoders = 16
encoder_counts = 1

# code = [scan column, bit]: columns 0..3 of the FlexBus panel device. The
# names, codes and LEDs are the factory UI test's (0x400521c8), checked
# by pressing each from a fresh resume: what it drew and what it lit.
# 32 is the PITCH knob's push switch (the key callback asks whether PITCH
# turned while it was held).
[panel.exceptions]
1  = [1, 2]   # FUNCTION
2  = [1, 5]   # TRACK
3  = [1, 3]   # PATTERN
4  = [1, 4]   # RETRIG
5  = [0, 0]   # MACHINE
6  = [0, 1]   # PUNCH
7  = [0, 2]   # GATE
8  = [0, 3]   # LFO
9  = [1, 1]   # RECORD
10 = [0, 7]   # PLAY
11 = [0, 5]   # STOP
12 = [1, 0]   # BACK
13 = [0, 6]   # SETTINGS
14 = [0, 4]   # TEMPO
15 = [3, 6]   # PAGE
16 = [1, 6]   # 1
17 = [1, 7]   # 2
18 = [2, 0]   # 3
19 = [2, 1]   # 4
20 = [2, 2]   # 5
21 = [2, 3]   # 6
22 = [2, 4]   # 7
23 = [2, 5]   # 8
24 = [2, 6]   # 9
25 = [2, 7]   # 10
26 = [3, 0]   # 11
27 = [3, 1]   # 12
28 = [3, 2]   # 13
29 = [3, 3]   # 14
30 = [3, 4]   # 15
31 = [3, 5]   # 16
32 = [3, 7]   # PITCH

# Pad code = ADC channel: pad Tn is read on channel 6 - n (0x4010adc0).
[panel.pads]
33 = 5   # T1
34 = 4   # T2
35 = 3   # T3
36 = 2   # T4
37 = 1   # T5
38 = 0   # T6

